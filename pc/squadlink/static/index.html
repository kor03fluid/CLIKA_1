<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQUAD LINK 디버그</title>
<style>
  :root { --bg:#fff; --fg:#1b1b1b; --mute:#666; --line:#ddd; --card:#f6f6f6;
          --crit:#c62828; --warn:#b26a00; --ok:#2e7d32; --virt:#6a1b9a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121212; --fg:#eee; --mute:#9a9a9a; --line:#333; --card:#1e1e1e;
            --crit:#ef5350; --warn:#ffb74d; --ok:#66bb6a; --virt:#ce93d8; }
  }
  body { margin:0; padding:12px 16px; background:var(--bg); color:var(--fg);
         font:14px/1.4 system-ui, sans-serif; }
  h1 { font-size:16px; margin:0 0 4px; }
  h2 { font-size:14px; margin:16px 0 6px; color:var(--mute); }
  .note { color:var(--mute); font-size:12px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:8px; }
  .card.off { opacity:.55; }
  .tag { display:inline-block; white-space:nowrap; padding:0 6px; border-radius:4px; font-size:11px; border:1px solid currentColor; }
  .crit { color:var(--crit); } .warn { color:var(--warn); } .ok { color:var(--ok); } .virt { color:var(--virt); }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  td, th { border-bottom:1px solid var(--line); padding:3px 4px; text-align:left; }
  .scroll { overflow-x:auto; }
  button, select, input { font:inherit; }
  pre { white-space:pre-wrap; word-break:break-all; margin:4px 0 0; font-size:11px; color:var(--mute); }
</style>
</head>
<body>
<h1>SQUAD LINK PC 서버 디버그 화면</h1>
<div class="note">데이터 확인용. 관제 UI는 팀장 담당이며 같은 API(/api/state, /api/stream)를 쓴다.</div>
<div class="row" style="margin-top:8px">
  <span id="conn" class="tag">연결 중</span>
  <span id="totals" class="note"></span>
</div>

<h2>가상 노드</h2>
<div class="row">
  <select id="scenario"></select>
  <input id="vnodes" placeholder="노드(예: 2 또는 1,2,0x31)" size="18">
  <label><input type="checkbox" id="vloop"> 반복</label>
  <button id="vstart">시작</button>
  <button id="vstop">중지</button>
  <span id="vstatus" class="note"></span>
</div>

<h2>노드</h2>
<div id="nodes" class="cards"></div>

<h2>앵커 관측 (직접 수신 RSSI)</h2>
<div class="scroll"><table id="anchors"></table></div>

<h2>이벤트</h2>
<div class="scroll"><table id="events"></table></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hex = (n) => "0x" + Number(n).toString(16).padStart(2, "0");
const fmtTime = (ts) => ts ? new Date(ts * 1000).toLocaleTimeString() : "-";
const label = (o) => o.source === "replay" ? '<span class="tag virt">재생</span>'
  : (o.virtual ? '<span class="tag virt">가상</span>' : '<span class="tag ok">실측</span>');
let events = [];

function renderState(s) {
  const t = s.totals;
  $("totals").textContent = `패킷 ${t.packets} · 중복 제거 ${t.dup} · 무효 ${t.invalid} · 입력 ` +
    ((s.inputs || []).map((i) => `${i.port}:${i.connected ? "연결" : "끊김"}`).join(", ") || "없음");
  const v = s.virtual || {};
  $("vstatus").textContent = v.running ? `실행 중: ${v.scenario} t=${v.t}s / ${v.length_s}s` : "중지";

  $("nodes").innerHTML = Object.values(s.nodes).map((n) => {
    const p = n.latest.soldier || n.latest.env || n.latest.anchor || {};
    let body = "";
    if (n.latest.soldier) {
      const q = n.latest.soldier, gps = q.gps || {};
      body = `심박 ${q.hr_valid ? q.hr : "접촉 불량"} · 움직임 ${esc(q.motion)} · 모드 ${esc(q.op_mode)}<br>` +
        `SOS ${q.sos ? '<b class="crit">ON</b>' : "off"} · 경보 ${esc(q.alert)} ${esc((q.reasons || []).join(","))}<br>` +
        `GPS ${gps.valid ? gps.lat + ", " + gps.lon : "무효"} · 체온 ${q.body_temp ?? "-"}${q.body_temp_virtual ? " (가상)" : ""}`;
    } else if (n.latest.env) {
      const e = n.latest.env;
      body = `온도 ${e.temp ?? "-"}°C · 습도 ${e.hum ?? "-"}% · 밝기 ${e.light ?? "-"}%<br>` +
        `상태 ${esc((e.state || []).join(",") || "-")} · 송신 ${esc(e.tx_mode)}`;
    }
    const c = n.counters;
    return `<div class="card ${n.online ? "" : "off"}">
      <b>${hex(n.node)}</b> ${esc(n.kind)} ${label(n)}
      <span class="tag ${n.online ? "ok" : "crit"}">${n.online ? "수신 중" : "통신 두절"}</span>
      ${n.via === "relay" ? '<span class="tag warn">중계 경유</span>' : ""}
      <div>${body}</div>
      <div class="note">마지막 수신 ${n.age_s}s 전 · boot ${n.boot} seq ${n.last_seq} ·
        수신 ${c.rx} 중복 ${c.dup} 누락 ${c.missing} 중계 ${c.relayed} 재부팅 ${c.reboots}</div>
    </div>`;
  }).join("") || '<div class="note">수신한 노드 없음</div>';

  const rows = [];
  for (const [a, t] of Object.entries(s.anchors))
    for (const [sid, o] of Object.entries(t))
      rows.push(`<tr><td>${hex(a)}</td><td>${hex(sid)}</td><td>${o.rssi}</td><td>${o.rssi_avg}</td>` +
        `<td>${o.n}</td><td>${o.age_s}s</td><td>${o.virtual ? "가상" : "실측"}</td></tr>`);
  $("anchors").innerHTML = "<tr><th>앵커</th><th>병사</th><th>RSSI</th><th>평균</th><th>표본</th><th>경과</th><th></th></tr>" +
    (rows.join("") || '<tr><td colspan="7" class="note">관측 없음(구역 미확보)</td></tr>');
}

function renderEvents() {
  const cls = { critical: "crit", warning: "warn", info: "" };
  $("events").innerHTML = "<tr><th>#</th><th>시각</th><th>노드</th><th>종류</th><th></th><th>확인/해결</th></tr>" +
    events.slice().reverse().slice(0, 100).map((e) => `<tr>
      <td>${e.id}</td><td>${fmtTime(e.ts)}</td><td>${hex(e.node)}</td>
      <td class="${cls[e.level] || ""}">${esc(e.kind)}</td><td>${label(e)}</td>
      <td>${e.acked_at ? "확인 " + fmtTime(e.acked_at) : `<button data-a="ack" data-id="${e.id}">확인</button>`}
          ${e.resolved_at ? "해결 " + fmtTime(e.resolved_at) : `<button data-a="resolve" data-id="${e.id}">해결</button>`}</td>
    </tr>`).join("");
}

function upsertEvent(e) {
  const i = events.findIndex((x) => x.id === e.id);
  if (i >= 0) events[i] = e; else events.push(e);
  if (events.length > 500) events = events.slice(-500);
}

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(body || {}) });
  return r.json();
}

$("events").addEventListener("click", async (ev) => {
  const b = ev.target.closest("button[data-a]");
  if (!b) return;
  upsertEvent(await post(`/api/events/${b.dataset.id}/${b.dataset.a}`, { by: "debug" }));
  renderEvents();
});
$("vstart").onclick = () => post("/api/virtual", {
  enabled: true, scenario: $("scenario").value, loop: $("vloop").checked,
  nodes: $("vnodes").value.split(",").map((x) => x.trim()).filter(Boolean) });
$("vstop").onclick = () => post("/api/virtual", { enabled: false });

fetch("/api/scenarios").then((r) => r.json()).then((list) => {
  $("scenario").innerHTML = list.map((n) => `<option ${n === "demo" ? "selected" : ""}>${n}</option>`).join("");
});
fetch("/api/events").then((r) => r.json()).then((list) => { list.forEach(upsertEvent); renderEvents(); });

const es = new EventSource("/api/stream");
es.addEventListener("state", (m) => renderState(JSON.parse(m.data)));
es.addEventListener("event", (m) => { upsertEvent(JSON.parse(m.data)); renderEvents(); });
es.onopen = () => { $("conn").textContent = "서버 연결"; $("conn").className = "tag ok"; };
es.onerror = () => { $("conn").textContent = "서버 끊김"; $("conn").className = "tag crit"; };
</script>
</body>
</html>
