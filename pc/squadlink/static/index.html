<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQUAD LINK 디버그</title>
<style>
  :root { --bg:#fff; --fg:#1b1b1b; --mute:#666; --line:#ddd; --card:#f6f6f6;
          --crit:#c62828; --warn:#b26a00; --ok:#2e7d32; --virt:#6a1b9a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121212; --fg:#eee; --mute:#9a9a9a; --line:#333; --card:#1e1e1e;
            --crit:#ef5350; --warn:#ffb74d; --ok:#66bb6a; --virt:#ce93d8; }
  }
  body { margin:0; padding:12px 16px; background:var(--bg); color:var(--fg);
         font:14px/1.4 system-ui, sans-serif; }
  h1 { font-size:16px; margin:0 0 4px; }
  h2 { font-size:14px; margin:16px 0 6px; color:var(--mute); }
  .note { color:var(--mute); font-size:12px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .tag { display:inline-block; white-space:nowrap; padding:0 6px; border-radius:4px; font-size:11px;
         border:1px solid currentColor; }
  .crit { color:var(--crit); } .warn { color:var(--warn); } .ok { color:var(--ok); }
  .virt { color:var(--virt); } .mute { color:var(--mute); }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  td, th { border-bottom:1px solid var(--line); padding:3px 4px; text-align:left; vertical-align:top; }
  tr.stale td { opacity:.6; }
  .scroll { overflow-x:auto; }
  button, select, input { font:inherit; max-width:100%; box-sizing:border-box; }
</style>
</head>
<body>
<h1>SQUAD LINK C 시험 서버</h1>
<div class="note">팀원 C의 환경 노드·앵커 시험용 화면. 공식 관제는 팀장 서버(8080)다. 시각은 한국 시간.</div>
<div class="row" style="margin-top:8px">
  <span id="conn" class="tag">연결 중</span>
  <span id="totals" class="note"></span>
</div>

<h2>가상 노드</h2>
<div class="row">
  <select id="scenario"></select>
  <input id="vnodes" placeholder="노드(예: halo_02 또는 halo_01,env_01)" size="28">
  <label><input type="checkbox" id="vloop"> 반복</label>
  <button id="vstart">시작</button>
  <button id="vstop">중지</button>
  <span id="vstatus" class="note"></span>
</div>

<h2>장치 명령</h2>
<div class="row">
  <select id="cport"></select>
  <input id="ccmd" placeholder="stats · mode fixed · anchor off · vtemp 38" size="36">
  <button id="csend">보내기</button>
  <span id="cresult" class="note"></span>
</div>
<div id="dstats" class="note"></div>

<h2>분대원</h2>
<div class="scroll"><table id="soldiers"></table></div>

<h2>환경 노드</h2>
<div class="scroll"><table id="envs"></table></div>

<h2>사건</h2>
<div class="scroll"><table id="events"></table></div>

<h2>앵커 관측 (직접 수신 RSSI)</h2>
<div class="scroll"><table id="anchors"></table></div>

<h2>최근 무효·경고 패킷</h2>
<div class="scroll"><table id="issues"></table></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kst = (iso) => iso ? new Date(iso).toLocaleTimeString("ko-KR", { timeZone: "Asia/Seoul" }) : "-";
const CONN = { unassigned: ["장치 미배정", "mute"], waiting: ["연결 대기", "warn"],
               connected: ["연결", "ok"], lost: ["통신 두절", "crit"] };
const EVSTATE = { open: ["미확인", "crit"], acknowledged: ["확인", "warn"], resolved: ["종료", "mute"] };
const EVTYPE = { sos: "SOS", impact: "충격", prolonged_still: "장시간 무움직임",
                 heat_exposure: "환경 열 노출 주의", connection_lost: "통신 두절" };
const tag = (pair) => `<span class="tag ${pair[1]}">${esc(pair[0])}</span>`;
const srcTag = (source, input) => input === "replay" ? '<span class="tag virt">재생</span>'
  : source === "simulation" ? '<span class="tag virt">가상</span>'
  : source === "device" ? '<span class="tag ok">실측</span>' : "";
const yn = (v) => v === true ? "예" : v === false ? "아니오" : "측정 불가";
let events = [];

function renderState(s) {
  const t = s.totals;
  $("totals").textContent = `수신 ${t.accepted} · 중복 ${t.dup} · 지연 ${t.late + t.stale_boot} · ` +
    `무효 ${t.invalid} · 경고 ${t.warnings} · 가려짐 ${t.shadowed} · 입력 ` +
    ((s.inputs || []).map((i) => `${i.port}:${i.connected ? "연결" : "끊김"}`).join(", ") || "없음") +
    (s.log && (s.log.error || s.log.dropped) ? ` · 로그 쓰기 실패(버린 줄 ${s.log.dropped}): ${s.log.error}` : "");
  renderPorts(s.inputs);
  $("dstats").innerHTML = Object.values(s.device_stats || {}).map((d) => {
    const tx = d.tx || {}, a = d.anchor || {};
    return `<div>${esc(d.node_id)} stats (${esc(kst(d.received_at))}): ${esc(d.tx_mode)} · 앵커 ` +
      `${d.anchor_enabled === false ? "끔" : "켬"} · 패킷 ${esc(tx.packets)} · 창 ${esc(tx.windows)} · ` +
      `버림 ${esc(tx.dropped)} · 앵커 수신 ${esc(a.rx_soldier)} · 앵커 보고 ${esc(a.reports)}</div>`;
  }).join("");
  const v = s.virtual || {};
  $("vstatus").textContent = v.running ? `실행 중: ${v.scenario} t=${v.t}s / ${v.length_s}s` +
    (v.note ? ` · 주의: ${v.note}` : "") : "중지";

  $("soldiers").innerHTML = "<tr><th>분대원</th><th>장치</th><th>연결</th><th>출처</th><th>모드</th>" +
    "<th>심박</th><th>움직임</th><th>위치</th><th>마지막 수신</th><th>진행 중 사건</th></tr>" +
    s.soldiers.map((x) => {
      const st = x.status || {};
      const hr = x.status ? (st.heart_rate_quality === "good" ? `${esc(st.heart_rate_bpm)} bpm`
                                                             : `측정 불가(${esc(st.heart_rate_quality)})`) : "-";
      const loc = x.location ? (x.location.fix_valid
          ? `${esc(x.location.latitude_deg)}, ${esc(x.location.longitude_deg)}`
          : `미수신${x.location.location_updated_at ? " (마지막 " + esc(kst(x.location.location_updated_at)) + ")" : ""}`)
        : "-";
      return `<tr class="${x.data_stale && x.connection_state !== "unassigned" ? "stale" : ""}">
        <td>${esc(x.soldier_id)}${x.name ? " " + esc(x.name) : ""}</td><td>${esc(x.assigned_node_id ?? "-")}</td>
        <td>${tag(CONN[x.connection_state] || [x.connection_state, ""])}</td>
        <td>${srcTag(x.source, x.input)}${x.route === "relay" ? ' <span class="tag warn">중계</span>' : ""}</td>
        <td>${x.status ? (st.mode === "covert" ? "기도비닉" : "일반") : "-"}</td>
        <td>${hr}</td><td>${esc(st.motion_state ?? "-")}</td><td>${loc}</td>
        <td>${esc(kst(x.last_seen_at))}</td><td>${esc(x.active_event_ids.length || "")}</td></tr>`;
    }).join("");

  $("envs").innerHTML = "<tr><th>노드</th><th>설치 지점</th><th>연결</th><th>출처</th><th>공기 온도</th>" +
    "<th>습도</th><th>조도(원시값)</th><th>소리·불꽃·충격</th><th>리드 닫힘</th><th>마지막 수신</th></tr>" +
    (s.environment_nodes.map((x) => {
      const e = x.environment || {};
      return `<tr class="${x.data_stale ? "stale" : ""}"><td>${esc(x.node_id)}</td><td>${esc(x.location_name ?? "-")}</td>
        <td>${tag(CONN[x.connection_state] || [x.connection_state, ""])}</td><td>${srcTag(x.source, x.input)}</td>
        <td>${x.environment ? esc(e.air_temperature_c ?? "측정 불가") + " °C" : "-"}</td>
        <td>${x.environment ? esc(e.humidity_pct ?? "측정 불가") + " %" : "-"}</td>
        <td>${x.environment ? esc(e.light_raw ?? "측정 불가") : "-"}</td>
        <td>${x.environment ? [e.sound_detected, e.flame_detected, e.shock_detected].map(yn).map(esc).join(" · ") : "-"}</td>
        <td>${x.environment ? esc(yn(e.reed_closed)) : "-"}</td><td>${esc(kst(x.last_seen_at))}</td></tr>`;
    }).join("") || '<tr><td colspan="10" class="note">환경 노드 없음</td></tr>');

  $("anchors").innerHTML = "<tr><th>앵커</th><th>관측 노드</th><th>RSSI</th><th>관측 경과</th><th>출처</th></tr>" +
    (s.anchor_observations.map((a) => `<tr><td>${esc(a.anchor_id)}</td><td>${esc(a.observed_node_id)}</td>
      <td>${esc(a.rssi_dbm)} dBm</td><td>${esc((a.age_ms / 1000).toFixed(1))} s</td><td>${srcTag(a.source, a.input)}</td></tr>`).join("")
     || '<tr><td colspan="5" class="note">관측 없음(구역 미확보)</td></tr>');

  const issues = [...s.recent_invalid.map((i) => ["무효", i.received_at, i.node_id, i.errors]),
                  ...s.recent_warnings.map((i) => ["경고", i.received_at, i.node_id, i.warnings])]
    .sort((a, b) => (a[1] < b[1] ? 1 : -1)).slice(0, 15);
  $("issues").innerHTML = "<tr><th></th><th>시각</th><th>노드</th><th>내용</th></tr>" +
    (issues.map((i) => `<tr><td>${esc(i[0])}</td><td>${esc(kst(i[1]))}</td><td>${esc(i[2] ?? "-")}</td>
      <td>${esc(i[3].join(" / "))}</td></tr>`).join("") || '<tr><td colspan="4" class="note">없음</td></tr>');
}

function renderEvents() {
  $("events").innerHTML = "<tr><th>#</th><th>최초 수신</th><th>사건</th><th>분대원·노드</th><th>출처</th>" +
    "<th>상태</th><th>보고 수</th><th>조작</th></tr>" +
    events.slice().reverse().slice(0, 100).map((e) => {
      const id = esc(e.event_id), src = esc(e.source ?? "");
      return `<tr><td>${esc(e.n)}</td><td>${esc(kst(e.first_received_at))}</td>
        <td class="${e.event_type === "sos" ? "crit" : ""}">${esc(EVTYPE[e.event_type] || e.event_type)}${e.late ? " (지연 수신)" : ""}</td>
        <td>${esc(e.soldier_id ?? "-")} · ${esc(e.node_id)}</td><td>${srcTag(e.source, e.input)}</td>
        <td>${tag(EVSTATE[e.event_state] || [e.event_state, ""])}</td><td>${esc(e.report_count)}</td>
        <td>${e.event_state === "open" ? `<button data-a="ack" data-id="${id}" data-src="${src}">확인</button>` : esc(kst(e.acknowledged_at))}
            ${e.event_state !== "resolved" ? `<button data-a="resolve" data-id="${id}" data-src="${src}">종료</button>` : esc(kst(e.resolved_at))}</td></tr>`;
    }).join("");
}

function upsertEvent(e) {
  const i = events.findIndex((x) => x.event_id === e.event_id && x.source === e.source);
  if (i >= 0) events[i] = e; else events.push(e);
  if (events.length > 500) events = events.slice(-500);
}

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(body || {}) });
  return r.json();
}

$("events").addEventListener("click", async (ev) => {
  const b = ev.target.closest("button[data-a]");
  if (!b) return;
  const q = b.dataset.src ? `?source=${encodeURIComponent(b.dataset.src)}` : "";
  const r = await post(`/api/events/${encodeURIComponent(b.dataset.id)}/${b.dataset.a}${q}`, { by: "debug" });
  if (r.event_id) { upsertEvent(r); renderEvents(); }
});
$("vstart").onclick = () => post("/api/virtual", {
  enabled: true, scenario: $("scenario").value, loop: $("vloop").checked,
  nodes: $("vnodes").value.split(",").map((x) => x.trim()).filter(Boolean) });
$("vstop").onclick = () => post("/api/virtual", { enabled: false });

let portsKey = null;
function renderPorts(inputs) {  // 목록이 바뀔 때만 다시 그려 선택을 유지한다
  const ports = (inputs || []).map((i) => i.port);
  if (ports.join("\n") === portsKey) return;
  portsKey = ports.join("\n");
  const cur = $("cport").value;
  $("cport").innerHTML = ports.length
    ? ports.map((p) => `<option ${p === cur ? "selected" : ""}>${esc(p)}</option>`).join("")
    : '<option value="">시리얼 입력 없음</option>';
}
async function sendCmd() {
  const port = $("cport").value, cmd = $("ccmd").value.trim();
  if (!port || !cmd) return;
  const r = await post("/api/cmd", { port, cmd });
  $("cresult").textContent = r.sent ? `보냄: ${cmd} (${kst(new Date().toISOString())})`
                                    : `실패: ${r.error || "포트가 닫혀 있음"}`;
}
$("csend").onclick = sendCmd;
$("ccmd").addEventListener("keydown", (e) => { if (e.key === "Enter") sendCmd(); });

fetch("/api/scenarios").then((r) => r.json()).then((list) => {
  $("scenario").innerHTML = list.map((n) => `<option ${n === "demo" ? "selected" : ""}>${esc(n)}</option>`).join("");
});
// 사건 목록은 SSE가 (다시) 연결될 때마다 받는다. 끊긴 동안 생기거나 바뀐 사건을 놓치지 않게.
const loadEvents = () => fetch("/api/events?limit=500").then((r) => r.json())
  .then((list) => { list.forEach(upsertEvent); renderEvents(); }).catch(() => {});

const es = new EventSource("/api/stream");
es.addEventListener("state", (m) => renderState(JSON.parse(m.data)));
es.addEventListener("event", (m) => { upsertEvent(JSON.parse(m.data)); renderEvents(); });
es.onopen = () => { $("conn").textContent = "서버 연결"; $("conn").className = "tag ok"; loadEvents(); };
es.onerror = () => { $("conn").textContent = "서버 끊김"; $("conn").className = "tag crit"; };
</script>
</body>
</html>
